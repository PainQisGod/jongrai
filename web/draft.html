<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Draft Board - Jongrai</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/kit.css">
<link rel="stylesheet" href="/css/draft.css"></head><body>
<main class="page">
 <section class="rail" aria-label="Draft order">
  <div class="tools"><button class="ghost" id="undo" disabled title="Undo your last pick or ban (Ctrl+Z)"><span>↶ Undo</span></button>
   <button class="ghost" id="reset" title="Hold to clear the board"><span class="fill"></span><span id="resetLbl">Hold to reset</span></button>
   <span class="music"><select class="ghost" id="musicChoice" aria-label="Background music"><option value="off">♪ Music: Off</option><option value="music1">♪ Music 1</option><option value="music2">♪ Music 2</option><option value="music3">♪ Music 3</option><option value="music4">♪ Music 4</option></select>
   <button class="ghost" id="musicToggle" type="button" aria-pressed="false" disabled title="Play or mute the background music">Muted</button></span></div>
  <div class="turn" aria-live="polite"><span class="eyebrow" id="phase">Ban phase 1</span><h1 id="turnLine">…</h1><span class="step num" id="stepNo"></span><span class="clock num" id="clock" hidden role="timer" aria-live="off"><i></i><b id="clockN">50</b></span></div>
  <div class="acting">
   <button class="switch" id="bansOn" role="switch" aria-checked="true" title="Off: picks only, in the 10-step snake order"><i></i>Bans</button>
   <button class="switch" id="follow" role="switch" aria-checked="true"><i></i>Follow draft order</button>
   <div class="seg" id="sideSeg" aria-label="Acting side"><button class="b" data-s="blue">BLUE</button><button class="r" data-s="red">RED</button></div>
   <div class="seg" id="kindSeg" aria-label="Action"><button data-k="pick">PICK</button><button data-k="ban">BAN</button></div>
  </div>
  <div class="setup" aria-label="Match settings">
   <label class="mapsel"><img id="mapIc" alt="" hidden><select class="ghost" id="mapChoice" aria-label="Map"><option value="">Map: any</option></select></label>
   <select class="ghost" id="timerChoice" aria-label="Pick and ban timer"><option value="0">Timer: off</option><option value="50">Timer: 50 seconds</option></select>
  </div>
  <ol class="notches" id="notches"></ol>
 </section>

 <section class="stage">
  <div class="side blue panel" id="side-blue"></div>
  <div class="scale" id="scale">
   <svg viewBox="0 0 200 200" aria-hidden="true">
    <g class="ticks" id="ticks"></g>
    <circle class="track" cx="100" cy="100" r="84"/>
    <circle class="arc" id="arc" cx="100" cy="100" r="84" stroke-dasharray="263.9 527.8"/>
    <g class="needle" id="needle"><path d="M100 8 l6 8 -6 8 -6 -8z"/></g><g class="needle" id="needle2" style="transform:rotate(180deg)"><path d="M100 8 l6 8 -6 8 -6 -8z"/></g>
   </svg>
   <div class="score"><span class="lead" id="lead">EVEN</span><div class="pair"><span class="b num" id="eb">50</span><i>:</i><span class="r num" id="er">50</span></div></div>
   <p class="headline" id="headline">The draft is even</p>
  </div>
  <div class="side red panel" id="side-red"></div>
 </section>

 <section class="lower">
  <div class="pool panel">
   <div class="filters">
    <label class="search"><span class="sr">Search heroes</span><svg viewBox="0 0 16 16" fill="none" stroke-width="2"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg>
     <input id="q" placeholder="Search 133 heroes" autocomplete="off"><kbd>/</kbd></label>
    <div id="roles" style="display:contents"></div>
   </div>
   <div class="filters" id="lanes"></div>
   <div class="grid" id="grid"></div>
   <div class="lens" id="lens"></div>
  </div>
  <aside class="council">
   <div class="card panel" id="next"></div>
   <div class="card panel" id="edge"></div>
   <div class="card panel" id="profile"></div>
   <div class="card panel" id="coord"></div>
  </aside>
 </section>
 <section class="coach panel" id="coach" aria-live="polite"></section>
</main>
<script src="/app.js"></script>
<script src="/kit.js"></script>
<iframe id="draftMusic" class="draft-music" title="Draft board background music" allow="autoplay" tabindex="-1"></iframe>
<script src="/js/draft.js"></script></body></html>
