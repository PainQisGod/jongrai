<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Draft Analysis - Project Jongrai</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/style.css">
<style>
main{display:grid;grid-template-columns:250px 1fr 250px;gap:12px;padding:12px 16px;align-items:start}
.team{background:var(--card);border-radius:10px;padding:10px 12px;border-top:3px solid}.team.blue{border-color:var(--blue)}.team.red{border-color:var(--red)}
.team h2{margin:0 0 4px;font-size:15px;letter-spacing:2px}.lbl{color:var(--mut);font-size:12px;margin:12px 0 6px;border-top:1px solid var(--line);padding-top:8px}.team h2+.lbl{border:0;margin-top:6px;padding:0}
.row{display:flex;align-items:center;gap:10px;min-height:54px;padding:4px;border-radius:8px}
.rm{background:transparent;color:#fca5a5;font-size:11px;padding:2px 6px;flex:none}.rm:hover{background:#2a1d22}
.cir{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:#222736;overflow:hidden;flex:none}
.cir img{width:100%;height:100%;object-fit:cover;display:block}.row.f .cir{border-color:#556}
.nm{flex:1;min-height:26px;border-bottom:1px solid var(--line);padding-bottom:3px}.row.ban{min-height:42px}.row.ban .cir{width:32px;height:32px}
.row.ban.f .nm b{text-decoration:line-through;color:var(--mut)}select.ln{display:block;width:100%;margin-top:4px;padding:2px 4px;font-size:12px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;max-height:46vh;overflow:auto;background:var(--card);border-radius:10px;padding:8px}
.hero{border:1px solid var(--line);border-left-width:4px;border-radius:6px;padding:6px;text-align:left;font-size:12px;position:relative}
.hero .cir{width:44px;height:44px;margin-bottom:4px}.hero small{display:block;color:var(--mut)}.hero.used{opacity:.3;pointer-events:none}
.tl{position:absolute;top:3px;right:5px;font-style:normal;font-weight:700;font-size:11px;opacity:.95}
.tS{border-left-color:#f5c518}.tA{border-left-color:#22c55e}.tB{border-left-color:#3b82f6}.tC{border-left-color:#8b91a3}.tD{border-left-color:#ef4444}
.tS .tl{color:#f5c518}.tA .tl{color:#22c55e}.tB .tl{color:#3b82f6}.tC .tl{color:#a4abbd}.tD .tl{color:#ef4444}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin:0 0 8px;font-size:12px;color:var(--mut)}
.lg span{display:flex;align-items:center;gap:5px}
.lg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.lg b{color:var(--tx);font-weight:700;letter-spacing:.5px}
.lg em{font-style:normal;color:var(--mut)}
.sug{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.box{background:var(--card);border-radius:10px;padding:10px}
.box h3{margin:0 0 6px;font-size:13px}ul{list-style:none;margin:0;padding:0}
.sg{display:block;width:100%;text-align:left;background:transparent;padding:6px}.sg:hover{background:#222736}.sg span{color:#86efac;margin-left:6px}.sg small{display:block;color:var(--mut)}
.ep{background:var(--card);border-radius:10px;padding:12px 14px;margin-top:12px}
.ai-card{border:1px solid #8a6b1d;background:linear-gradient(135deg,#201a0f,#15171f)}.ai-card .ai-picks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.ai-choice{background:#12141b;border:1px solid var(--line);border-radius:6px;padding:8px;text-align:left;color:var(--tx);cursor:pointer}.ai-choice:hover{border-color:#d4a73a}.ai-choice b{display:block}.ai-choice small{display:block;color:var(--mut);margin-top:3px;line-height:1.35}.coord-score{display:flex;align-items:center;gap:8px;margin:2px 0 8px}.coord-score b{min-width:37px}.coord-score .bar{flex:1}
.comparison{padding:14px}.comparison .eh{margin-bottom:12px}.comparison-row{padding:10px 0;border-top:1px solid var(--line)}.comparison-row:first-of-type{border-top:0;padding-top:0}.comparison-title{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;font-size:12px;letter-spacing:1px;color:#d4a73a}.comparison-title small{color:var(--mut);letter-spacing:0}.comparison-values{display:grid;grid-template-columns:46px 1fr 46px;gap:8px;align-items:center}.comparison-values b:first-child{color:var(--blue);text-align:right}.comparison-values b:last-child{color:var(--red)}.comparison-bar{height:8px;background:var(--red);border-radius:4px;overflow:hidden}.comparison-bar i{display:block;height:100%;background:var(--blue)}.comparison-detail{margin:6px 0 0;text-align:center;color:var(--mut);font-size:12px}.draft-rating{font-size:13px;text-align:center;color:var(--tx)}.draft-rating.blue{color:var(--blue)}.draft-rating.red{color:var(--red)}
#mplBoard{display:none}.mpl-style main{grid-template-columns:minmax(0,1fr);max-width:1500px;margin:auto}.mpl-style main>.team{display:none}.mpl-style #mplBoard{display:block;background:linear-gradient(135deg,#171c35,#1b1728);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}.mpl-head{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;padding:10px 14px;background:#10131d;border-bottom:1px solid var(--line)}.mpl-head strong{color:var(--gold2);font-size:12px;letter-spacing:2px}.team-name{width:100%;border:0;border-radius:0;background:transparent;font-weight:800;font-size:15px;letter-spacing:1px;padding:4px 0}.team-name.blue{color:var(--blue);text-align:left}.team-name.red{color:var(--red);text-align:right}.mpl-picks{display:grid;grid-template-columns:minmax(0,1fr) 64px minmax(0,1fr);align-items:stretch}.mpl-side{display:grid;grid-template-columns:repeat(5,minmax(82px,1fr));gap:2px;padding:8px}.mpl-pick{min-width:0;min-height:0;aspect-ratio:9 / 16;position:relative;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;padding:8px 4px;background:#11141d;border:1px solid var(--line);border-radius:5px;color:var(--tx);cursor:pointer;overflow:hidden}.mpl-pick.blue{border-bottom:3px solid var(--blue)}.mpl-pick.red{border-bottom:3px solid var(--red)}.mpl-pick.empty{opacity:.35;justify-content:center;color:var(--mut);background:#11131a}.mpl-pick .cir{width:58px;height:58px}.mpl-pick b{max-width:100%;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;z-index:1;text-shadow:0 1px 4px #000}.mpl-slot{position:absolute;top:5px;left:7px;color:var(--mut);font-size:10px;font-weight:700;z-index:1}.mpl-lane{position:absolute;top:5px;right:6px;width:18px;height:18px;object-fit:contain;z-index:1}.mpl-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}.mpl-versus{display:flex;align-items:center;justify-content:center;background:linear-gradient(#e7c044,#aa7821);color:#18120a;font-weight:900;letter-spacing:1px}.mpl-style .lg{margin-top:0}
.mpl-bans{display:grid;grid-template-columns:minmax(0,1fr) 64px minmax(0,1fr);align-items:center;border-top:1px solid var(--line);background:#11131a}.mpl-ban-side{display:grid;grid-template-columns:repeat(5,minmax(50px,1fr));gap:3px;padding:7px}.mpl-ban{min-width:0;height:62px;position:relative;display:flex;align-items:flex-end;justify-content:center;padding:4px;background:#151821;border:1px solid var(--line);border-radius:4px;color:var(--mut);cursor:pointer;overflow:hidden}.mpl-ban .cir{width:42px;height:42px;opacity:.55;filter:grayscale(1)}.mpl-ban:not(.empty)::after{content:'×';position:absolute;inset:0;display:grid;place-items:center;color:#ff5b61;font-size:30px;font-weight:900;text-shadow:0 1px 5px #000}.mpl-ban.empty{opacity:.3}.mpl-ban-slot{position:absolute;top:3px;left:5px;font-size:9px;font-weight:700}.mpl-ban-title{text-align:center;color:#f87171;font-size:10px;font-weight:800;letter-spacing:1px}
.eh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}.eh span{color:#d4a73a;letter-spacing:2px;font-size:12px}
.cb{color:var(--blue);font-size:18px}.cr{color:var(--red);font-size:18px}
.bar{height:8px;background:var(--red);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}
.hl{text-align:center;font-weight:700;margin:10px 0 12px}.hl.blue{color:var(--blue)}.hl.red{color:var(--red)}.hl.even{color:var(--mut)}
.cat{margin-bottom:10px}.ct{display:flex;justify-content:space-between;margin-bottom:4px;font-size:12px}.ct small{color:var(--mut)}
.notes h3{margin:0 0 8px;font-size:12px;letter-spacing:1px;color:#d4a73a}
.notes h3 small{color:#f0c75e;letter-spacing:1px;font-weight:600;margin-left:6px}
.nt{padding:7px 10px;margin-bottom:6px;background:#12141b;border-left:3px solid var(--mut);border-radius:4px;font-size:13px}
.wd{margin-bottom:10px}.wd .wt{font-size:11px;letter-spacing:1px;margin-bottom:4px}
.wd.v .wt{color:#d4a73a}.wd.b .wt{color:var(--blue)}.wd.r .wt{color:var(--red)}.wd.c .wt{color:var(--mut)}
.wd p{margin:0;padding:7px 10px;background:#12141b;border-left:3px solid var(--mut);border-radius:4px;font-size:13px;line-height:1.5}
.wd.b p{border-color:var(--blue)}.wd.r p{border-color:var(--red)}.wd.c p{border-color:#d4a73a}.wd.err p{border-color:#ef4444}
.wd.row{display:flex;gap:10px;align-items:stretch;margin-bottom:10px}.wd.row>div{flex:1;min-width:0}
.wd.c button{background:#222736;border:1px solid var(--line);border-radius:6px;padding:5px 12px;cursor:pointer;font:inherit;color:var(--mut);width:100%}
.wd.c button:hover{border-color:var(--blue);color:var(--tx)}
#wisdom .load{color:var(--mut);font-size:13px}
.tpw{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.tpw svg{width:190px;flex:none}.tbars{flex:1;min-width:230px}
.tbars h3,.tp h3{margin:0 0 8px;font-size:12px;letter-spacing:1px;color:#d4a73a}.tb{margin-bottom:7px}.tb>small{display:block;text-align:center;color:var(--mut);font-size:11px;letter-spacing:1px;text-transform:uppercase}
.tr{display:grid;grid-template-columns:30px 1fr 1fr 30px;gap:4px;align-items:center;font-size:12px}.tr b:first-child{color:var(--blue);text-align:right}.tr b:last-child{color:var(--red)}
.tk{height:6px;background:#1c2030;border-radius:3px;display:flex}.tk.l{justify-content:flex-end}.tk i{display:block;height:100%;border-radius:3px}
@media(max-width:900px){main{grid-template-columns:1fr}.sug{grid-template-columns:1fr}.mpl-picks,.mpl-bans{overflow-x:auto}.mpl-side{min-width:450px}.mpl-ban-side{min-width:300px}.mpl-versus{min-width:50px}.team-name{font-size:12px}}
</style></head><body>
<header><h1><a href="/" aria-label="Project Jongrai"><img class="brand-logo" src="/icons/Jongrai_logo.png" alt="Project Jongrai"></a></h1>
<nav class="top"><a href="/">Home</a><a href="/heroes">Hero Statistics</a><a href="/items">Items</a><a href="/league">Professional League</a><a href="/draft" class="on">Draft Analysis</a><a href="/about">About</a></nav>
<span class="patch">as of Patch <span data-patch></span></span>
<hr class="draft-rule">
<div class="draft-controls"><div class="seg" id="sideSeg"><button data-s="blue" class="on b">Blue</button><button data-s="red">Red</button></div>
<div class="seg" id="modeSeg"><button data-m="pick" class="on">Pick</button><button data-m="ban">Ban</button></div>
<div class="seg" id="aiSeg"><button id="aiToggle" class="on">AI Suggest: ON</button></div>
<select id="musicChoice" aria-label="Background music"><option value="off">Music: Off</option><option value="music1">Music 1</option><option value="music2">Music 2</option><option value="music3">Music 3</option><option value="music4">Music 4</option></select>
<button id="musicToggle" type="button" aria-pressed="false" disabled>Music: Muted</button>
<button id="mplToggle" type="button" aria-pressed="false">MPL Style</button>
<div class="draft-filters"><input id="q" placeholder="Search hero..."><select id="role"><option value="">All roles</option></select><select id="lane"><option value="">All lanes</option></select>
<button id="reset">Reset</button><span id="msg"></span></div></div></header>
<main>
<div class="team blue" id="blue"></div>
<div class="draft-center"><div id="mplBoard" aria-label="MPL style draft board"><div class="mpl-head"><input class="team-name blue" data-team="blue" value="BLUE TEAM" aria-label="Blue team name"><strong>MPL DRAFT</strong><input class="team-name red" data-team="red" value="RED TEAM" aria-label="Red team name"></div><div id="mplBody"></div></div><div class="lg" id="legend"></div><div id="grid"></div>
 <div class="sug"><div class="box"><h3 id="pt">Best picks</h3><ul id="picks"></ul></div><div class="box"><h3 id="bt">Best bans</h3><ul id="bans"></ul></div></div><div id="aiBox"></div><div id="edge"></div></div>
<div class="team red" id="red"></div>
</main>
<iframe id="draftMusic" class="draft-music" title="Draft Analysis background music" allow="autoplay" tabindex="-1"></iframe>
<script src="/app.js"></script>
<script>
let heroes=[],state={version:0,blue:{picks:[],bans:[]},red:{picks:[],bans:[]}},side='blue',mode='pick',aiEnabled=true;
const teamNames={blue:'BLUE TEAM',red:'RED TEAM'};
const heroVideos={aamon:'Aamon.mp4',akai:'Akai.mp4',granger:'Granger.mp4',claude:'Claude.mp4',marcel:'Marcel.mp4'};
const byName={},LANES=['EXP','JUNGLE','MID','GOLD','ROAM'];
const msg=t=>{$('#msg').textContent=t||''};
/** Takes a state-changing reply: the new board, or a 409 carrying the board as it really is. */
function adopt(j){
 if(j.state)state=j.state;else if(!j.error)state=j;
 msg(j.error);
 if(j.state||!j.error)refresh();
}
let busy=false;
/** Sends one board change at a time: a double-click would otherwise send the same version twice and get a 409. */
async function change(url){
 if(busy)return;busy=true;
 try{adopt(await call(url,{post:true}))}finally{busy=false}
}
const act=(path,t,name,extra='')=>change(`/api/${path}?side=${t}&hero=${encodeURIComponent(name)}&v=${state.version}${extra}`);
const pad=(a,n)=>Array.from({length:n},(_,i)=>a[i]||'');
const cir=n=>{const h=byName[n];return`<div class="cir">${h&&h.icon?`<img src="/icons/${esc(h.icon)}" alt="" onerror="this.remove()">`:''}</div>`};
const rmBtn=(t,n)=>`<button type="button" class="rm" data-rm data-t="${t}" data-hero="${esc(n)}" aria-label="Remove ${esc(n)}">✕ remove</button>`;
function pickRow(t,p){if(!p)return'<div class="row"><div class="cir"></div><div class="nm"></div></div>';
  const own=(byName[p.name]||{lanes:[]}).lanes;
  const opts=[...own,...LANES.filter(l=>!own.includes(l))].map(l=>`<option value="${l}"${l===p.lane?' selected':''}>${l}${own.includes(l)?'':' (flex)'}</option>`).join('');
  const li=laneIcon(p.lane);
  return`<div class="row f">${cir(p.name)}<div class="nm"><b>${esc(p.name)}</b>${li?`<img src="/icons/${li}" alt="" onerror="this.remove()" style="width:14px;height:14px;margin-left:6px;vertical-align:middle" title="${esc(p.lane)}">`:''}<select class="ln" data-t="${t}" data-hero="${esc(p.name)}" aria-label="Lane for ${esc(p.name)}">${opts}</select></div>${rmBtn(t,p.name)}</div>`}
const banRow=(t,n)=>n?`<div class="row ban f">${cir(n)}<div class="nm"><b>${esc(n)}</b></div>${rmBtn(t,n)}</div>`:'<div class="row ban"><div class="cir"></div><div class="nm"></div></div>';
function drawTeams(){
 for(const t of['blue','red'])$('#'+t).innerHTML=`<h2>${t.toUpperCase()} SIDE</h2><div class="lbl">PICK</div>${pad(state[t].picks,5).map(p=>pickRow(t,p)).join('')}<div class="lbl">BAN</div>${pad(state[t].bans,5).map(n=>banRow(t,n)).join('')}`;
}
/** The hero grid depends only on local state and the filters, so typing in the search box redraws just this. */
function drawGrid(){
 const used=new Set([...state.blue.picks.map(p=>p.name),...state.blue.bans,...state.red.picks.map(p=>p.name),...state.red.bans]);
 const q=$('#q').value.toLowerCase(),role=$('#role').value,lane=$('#lane').value;
 $('#grid').innerHTML=heroes.filter(h=>h.name.toLowerCase().includes(q)&&(!role||h.roles.includes(role))&&(!lane||h.lanes.includes(lane)))
  .map(h=>`<button class="hero t${esc(h.tier)}${used.has(h.name)?' used':''}" data-h="${esc(h.name)}" title="${esc(h.name)} - tier ${esc(h.tier)}, ${h.winRate}% win">${cir(h.name)}<i class="tl">${esc(h.tier)}</i>${esc(h.name)}<small>${esc(h.roles.join('/'))} · ${h.lanes.map(l=>{const i=laneIcon(l);return i?`<img src="/icons/${i}" alt="" onerror="this.remove()" style="width:12px;height:12px;vertical-align:middle;margin-right:2px" title="${esc(l)}">`:''}).join('')}${esc(h.lanes.join('/'))}</small></button>`).join('');
}
function mplPick(t,p,i){
 if(!p)return `<div class="mpl-pick empty"><span>${i+1}</span></div>`;
 const icon=laneIcon(p.lane);
 const video=heroVideos[p.name.toLowerCase()];
 const visual=video?`<video class="mpl-video" src="/video/${video}" autoplay muted loop playsinline preload="metadata" onerror="this.remove()"></video>`:cir(p.name);
 return `<button type="button" class="mpl-pick ${t}" data-rm data-t="${t}" data-hero="${esc(p.name)}" title="${esc(p.name)} — click to remove" aria-label="Remove ${esc(p.name)}"><span class="mpl-slot">${i+1}</span>${visual}<b>${esc(p.name)}</b>${icon?`<img class="mpl-lane" src="/icons/${icon}" alt="${esc(p.lane)}" title="${esc(p.lane)}">`:''}</button>`;
}
function mplBan(t,n,i){
 if(!n)return `<div class="mpl-ban empty"><span class="mpl-ban-slot">${i+1}</span></div>`;
 return `<button type="button" class="mpl-ban" data-rm data-t="${t}" data-hero="${esc(n)}" title="${esc(n)} - click to remove ban" aria-label="Remove ban ${esc(n)}"><span class="mpl-ban-slot">${i+1}</span>${cir(n)}</button>`;
}
/** Only the picks and bans are redrawn; the team-name inputs live outside this and keep what was typed. */
function drawMpl(){
 $('#mplBody').innerHTML=`<div class="mpl-picks"><div class="mpl-side blue">${pad(state.blue.picks,5).map((p,i)=>mplPick('blue',p,i)).join('')}</div><div class="mpl-versus">VS</div><div class="mpl-side red">${pad(state.red.picks,5).map((p,i)=>mplPick('red',p,i)).join('')}</div></div>
 <div class="mpl-bans"><div class="mpl-ban-side">${pad(state.blue.bans,5).map((n,i)=>mplBan('blue',n,i)).join('')}</div><div class="mpl-ban-title">BANS</div><div class="mpl-ban-side">${pad(state.red.bans,5).map((n,i)=>mplBan('red',n,i)).join('')}</div></div>`;
}
/** After a change to the board: redraw it and fetch suggestions and the analysis once each. */
function refresh(){
 drawTeams();drawMpl();drawGrid();
 sugg();analyze();
 if(aiEnabled)autoSuggest();else removeAutoSuggest();
}
function profile(a){const ax=a.profile,n=ax.length,c=95,R=62;
 const pt=(i,v,k=R)=>{const g=-Math.PI/2+i*2*Math.PI/n;return[c+Math.cos(g)*k*v/10,c+Math.sin(g)*k*v/10]};
 const poly=(f,col)=>`<polygon points="${ax.map((x,i)=>pt(i,f(x)).join(',')).join(' ')}" fill="${col}" fill-opacity=".22" stroke="${col}" stroke-width="1.5"/>`;
 const rings=[2.5,5,7.5,10].map(v=>`<polygon points="${ax.map((_,i)=>pt(i,v).join(',')).join(' ')}" fill="none" stroke="#2a2f3d"/>`).join('');
 const lbl=ax.map((x,i)=>{const[px,py]=pt(i,10,R+14);return`<text x="${px}" y="${py+3}" text-anchor="middle" font-size="9" fill="#8b91a3">${esc(x.name)}</text>`}).join('');
 const bars=ax.map(x=>`<div class="tb"><small>${esc(x.name)}</small><div class="tr"><b>${x.blue}</b><div class="tk l"><i style="width:${x.blue*10}%;background:var(--blue)"></i></div><div class="tk"><i style="width:${x.red*10}%;background:var(--red)"></i></div><b>${x.red}</b></div></div>`).join('');
 return`<div class="ep tp"><h3>TACTICAL PROFILE</h3><div class="tpw"><svg viewBox="0 0 190 190">${rings}${poly(x=>x.blue,'#3b82f6')}${poly(x=>x.red,'#ef4444')}${lbl}</svg><div class="tbars">${bars}</div></div></div>`}
async function analyze(){
  const a=await call('/api/analysis');if(a.error){msg(a.error);return}
  $('#edge').innerHTML=`${comparison(a,a.coordination)}
  ${profile(a)}<div class="ep notes" id="wisdom"></div>`;
  wisdom();fillMeta()}

function comparisonRow(label, blue, red, detail=''){
  return `<div class="comparison-row"><div class="comparison-title"><span>${label}</span></div><div class="comparison-values"><b>${Math.round(blue)}</b><div class="comparison-bar"><i style="width:${blue}%"></i></div><b>${Math.round(red)}</b></div>${detail?`<p class="comparison-detail">${esc(detail)}</p>`:''}</div>`;
}
function comparison(a,c){
  const cat=name=>a.categories.find(x=>x.name===name)||{blueShare:50,detail:'No draft data yet'};
  const counter=cat('COUNTERS');
  return `<div class="ep comparison"><div class="eh"><span>DRAFT COMPARISON</span><small>BLUE <span class="cb">vs</span> RED</small></div>
    ${comparisonRow('DRAFT RATING',a.blueEdge,a.redEdge,`Blue rating: ${a.blueEdge}/100 · Red rating: ${a.redEdge}/100`)}
    ${comparisonRow('COUNTER INDEX',counter.blueShare,100-counter.blueShare,counter.detail)}
    ${comparisonRow('TEAM COORDINATION',c.blue.score,c.red.score,`Blue: ${c.blue.lanesCovered}/5 lanes, ${c.blue.synergyPairs} synergies, ${c.blue.heavyControl} lockdown · Red: ${c.red.lanesCovered}/5 lanes, ${c.red.synergyPairs} synergies, ${c.red.heavyControl} lockdown`)}</div>`;
}
let wkey='';
const isComplete=()=>state.blue.picks.length>=5&&state.red.picks.length>=5;
const whead=()=>`<h3>JONGRAI'S WISDOM <small>PATCH <span data-patch></span></small></h3>`;
/** Shown while the draft is unfinished (or the server says so). Never asks the server again by itself. */
function waiting(el){
 el.dataset.done='';
 el.innerHTML=whead()+`<div class="wd c"><p>Waiting for the draft to finish: ${state.blue.picks.length} vs ${state.red.picks.length} picks. Jongrai reads the board once all ten are locked in.</p></div>
  <div class="wd c"><p><button type="button" id="askNow">Read it now anyway</button></p></div>`;
 $('#askNow').onclick=()=>{wkey='';wisdom(true)};
}
async function wisdom(force,refreshRead){const el=$('#wisdom');if(!el)return;
 const sig=JSON.stringify(state)+(force?'!':'');
 if(sig===wkey&&el.dataset.done&&!refreshRead)return;wkey=sig;
 if(!isComplete()&&!force){waiting(el);return}
 el.dataset.done='';el.innerHTML=whead()+`<div class="load">Reading the draft...</div>`;
 const w=await call('/api/wisdom?'+(force?'force=1&':'')+(refreshRead?'refresh=1':''),{post:true});
 if(sig!==wkey)return;   // the board changed while the coach was reading
 if(w.error){el.innerHTML=whead()+`<div class="wd err"><p>${esc(w.error)}</p></div>`;fillMeta();return}
 if(!w.ready){waiting(el);fillMeta();return}
 const p=t=>`<div class="wd ${t[0]}"><div class="wt">${t[1]}</div><p>${esc(t[2])}</p></div>`;
 el.dataset.done='1';
 el.innerHTML=whead()+`<div class="wd v"><div class="wt">VERDICT</div><p>${esc(w.verdict)}</p></div>`
  +`<div class="wd row">${p(['b','BLUE SIDE',w.blue])}${p(['r','RED SIDE',w.red])}</div>`
  +(w.closing?`<div class="wd c"><div class="wt">KEY TO WATCH</div><p>${esc(w.closing)}</p></div>`:'')
  +`<div class="wd c"><p><button type="button" id="askAgain">Re-read the draft</button></p></div>`;
 $('#askAgain').onclick=()=>{wkey='';wisdom(force,true)};
 fillMeta();}
async function sugg(){
  const[p,b]=await Promise.all([call('/api/suggest?side='+side),call('/api/bans?side='+side)]);
  const nm=side[0].toUpperCase()+side.slice(1);$('#pt').textContent='Best picks for '+nm;$('#bt').textContent='Best bans for '+nm;
  const li=(l,k)=>(Array.isArray(l)?l:[]).map(i=>`<li><button type="button" class="sg" data-k="${k}" data-n="${esc(i.hero)}"><b>${esc(i.hero)}</b><span>${esc(i.score)}</span><small>${esc(i.reasons.join(', ')||'-')}</small></button></li>`).join('');
  $('#picks').innerHTML=li(p,'pick');$('#bans').innerHTML=li(b,'ban')}

function removeAutoSuggest(){$('#aiBox').innerHTML=''}
async function autoSuggest(){
  const r=await call('/api/auto-suggest');
  if(r.error||!r.active||!aiEnabled){removeAutoSuggest();return}
  $('#aiBox').innerHTML=`<div class="ep ai-card"><div class="eh"><span>AI SUGGEST · ${esc(r.turn.toUpperCase())} PICK</span><small>Choose one to lock it in</small></div><div class="ai-picks">`
   +r.suggestions.map(s=>`<button type="button" class="ai-choice" data-ai-pick="${esc(s.hero)}" data-ai-side="${esc(r.turn)}"><b>${esc(s.hero)} <span>${esc(s.score)}</span></b><small>${esc(s.reasons.join(', '))}</small></button>`).join('')+'</div></div>';
}
$('#aiToggle').onclick=()=>{aiEnabled=!aiEnabled; $('#aiToggle').textContent='AI Suggest: '+(aiEnabled?'ON':'OFF'); $('#aiToggle').className=aiEnabled?'on':''; if(aiEnabled)autoSuggest();else removeAutoSuggest()};
// Background music: nothing is loaded from YouTube until the user picks a track or presses the music button.
const musicTracks={music1:'KheFsJvAvsU',music2:'TxTprtLZurY',music3:'kgpqMfTZDTw',music4:'GJl_fn_skOM'};
const MUSIC_ORIGIN='https://www.youtube-nocookie.com';
let musicMuted=true;
function musicCommand(func){const frame=$('#draftMusic');if(frame.hasAttribute('src'))frame.contentWindow.postMessage(JSON.stringify({event:'command',func,args:[]}),MUSIC_ORIGIN)}
function loadMusic(muted){const id=musicTracks[$('#musicChoice').value],frame=$('#draftMusic');if(!id||frame.hasAttribute('src'))return;
 frame.src=`${MUSIC_ORIGIN}/embed/${id}?autoplay=1&mute=${muted?1:0}&loop=1&playlist=${id}&controls=0&enablejsapi=1&playsinline=1&rel=0`}
function musicLabel(){const b=$('#musicToggle');b.textContent='Music: '+(musicMuted?'Muted':'On');b.setAttribute('aria-pressed',String(!musicMuted))}
function setMusic(choice){const id=musicTracks[choice],frame=$('#draftMusic');musicMuted=true;musicLabel();$('#musicToggle').disabled=!id;
 musicCommand('stopVideo');frame.removeAttribute('src');store.set('jongrai-draft-music',choice);loadMusic(true)}
$('#musicChoice').onchange=e=>setMusic(e.target.value);
$('#musicToggle').onclick=()=>{
 if(!$('#draftMusic').hasAttribute('src')){musicMuted=false;loadMusic(false);musicLabel();return}
 musicMuted=!musicMuted;musicCommand(musicMuted?'mute':'unMute');if(!musicMuted)musicCommand('playVideo');musicLabel()};
$('#mplToggle').onclick=()=>{const on=document.body.classList.toggle('mpl-style');const b=$('#mplToggle');b.textContent='MPL Style: '+(on?'On':'Off');b.setAttribute('aria-pressed',String(on))};
document.addEventListener('click',e=>{if(e.target.closest('select'))return;
 const rm=e.target.closest('[data-rm]'),h=e.target.closest('[data-h]'),s=e.target.closest('[data-n]'),ai=e.target.closest('[data-ai-pick]');
 if(rm)act('remove',rm.dataset.t,rm.dataset.hero);else if(h)act(mode,side,h.dataset.h);else if(s)act(s.dataset.k,side,s.dataset.n);else if(ai)act('pick',ai.dataset.aiSide,ai.dataset.aiPick)});
document.addEventListener('change',e=>{const s=e.target.closest('select.ln');if(s)act('lane',s.dataset.t,s.dataset.hero,'&lane='+encodeURIComponent(s.value))});
document.addEventListener('input',e=>{const n=e.target.closest('.team-name');if(n)teamNames[n.dataset.team]=n.value});
$('#sideSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;side=b.dataset.s;
 document.querySelectorAll('#sideSeg button').forEach(x=>x.className=x===b?'on '+(side==='blue'?'b':'r'):'');sugg()};
$('#modeSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;mode=b.dataset.m;
 document.querySelectorAll('#modeSeg button').forEach(x=>x.className=x===b?'on':'')};
$('#reset').onclick=()=>change('/api/reset?v='+state.version);
// Another window may have changed the board; catch up when this one comes back.
addEventListener('focus',async()=>{const s=await call('/api/state');if(!s.error&&s.version!==state.version)adopt(s)});
['q','role','lane'].forEach(i=>$('#'+i).oninput=drawGrid);
(async()=>{
 const hs=await call('/api/heroes');if(hs.error){msg(hs.error);return}
 heroes=hs;heroes.forEach(h=>byName[h.name]=h);
 for(const[id,k]of[['role','roles'],['lane','lanes']])[...new Set(heroes.flatMap(h=>h[k]))].forEach(v=>$('#'+id).add(new Option(v,v)));
 const LABELS={S:'top',A:'strong',B:'solid',C:'average',D:'weak'};
 $('#legend').innerHTML='<b style="color:#d4a73a">TIER</b><em>meta ranking, patch <span data-patch></span></em>'+Object.keys(LABELS)
  .map(t=>`<span title="Tier ${t}"><i style="background:${TIER_COLORS[t]}"></i><b style="color:${TIER_COLORS[t]}">${t}</b><em>${LABELS[t]} · ${heroes.filter(h=>h.tier===t).length}</em></span>`).join('');
 // Restore the saved track in the menu only; the player itself waits for a click.
 const saved=store.get('jongrai-draft-music');
 if(saved&&musicTracks[saved]){$('#musicChoice').value=saved;$('#musicToggle').disabled=false}
 const s=await call('/api/state');if(s.error){msg(s.error);return}
 state=s;refresh();meta()})();
</script></body></html>
