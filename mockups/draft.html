<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Draft Board · Jongrai mockup</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="kit.css">
<style>
body{background:
  radial-gradient(900px 520px at 0% 10%,rgba(77,141,255,.13),transparent 60%),
  radial-gradient(900px 520px at 100% 10%,rgba(255,80,98,.12),transparent 60%),
  radial-gradient(700px 400px at 50% 0%,rgba(228,181,83,.07),transparent 70%),var(--night)}
main{max-width:1520px;margin:0 auto;padding:18px 24px 60px}

/* ---------- turn rail ---------- */
.rail{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;margin-bottom:18px}
.turn{grid-column:2;text-align:center}
.turn .eyebrow{display:block;margin-bottom:6px}
.turn h1{margin:0;font:700 26px/1.1 var(--display);letter-spacing:.04em;text-transform:uppercase}
.turn h1 b{transition:color .3s}.turn h1 .blue{color:var(--blue)}.turn h1 .red{color:var(--red)}
.turn .step{display:block;margin-top:4px;color:var(--ink-3);font-size:12px;letter-spacing:.18em}
.notches{grid-column:1/-1;display:flex;justify-content:center;align-items:flex-end;gap:5px;margin:0;padding:0;list-style:none}
.notches li{position:relative;flex:none;background:var(--stone-4);transition:background .3s,transform .3s var(--ease-spring)}
.notches .ban{width:10px;height:10px;transform:rotate(45deg) scale(.85);margin:0 2px 4px}
.notches .pick{width:9px;height:24px;border-radius:3px}
.notches .B{box-shadow:inset 0 -2px 0 rgba(77,141,255,.35)}.notches .R{box-shadow:inset 0 -2px 0 rgba(255,80,98,.35)}
.notches .done.B{background:var(--blue)}.notches .done.R{background:var(--red)}
.notches .now{background:transparent!important;outline:2px solid var(--gold-hi);animation:now 1.6s var(--ease-out) infinite}
.notches .pick.now{transform:scaleY(1.15)}
.notches .now::after{content:"";position:absolute;left:50%;bottom:-11px;border:4px solid transparent;border-bottom-color:var(--gold-hi);transform:translateX(-50%)}
.notches .ban.now::after{bottom:-14px;transform:translateX(-50%) rotate(-45deg)}
.notches .gap{width:18px;height:1px;background:var(--hair-2);margin:0 4px 12px}
@keyframes now{0%,100%{outline-color:var(--gold-hi)}50%{outline-color:rgba(246,213,138,.25)}}
.acting{grid-column:3;grid-row:1;justify-self:end;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.tools{grid-column:1;grid-row:1;display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--stone-2);border:1px solid var(--hair)}
.seg button{border:0;background:transparent;height:26px;padding:0 12px;border-radius:999px;cursor:pointer;color:var(--ink-2);
  font:600 11px/1 var(--display);letter-spacing:.12em;transition:background .25s,color .25s}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--night)}
.seg button.b[aria-pressed=true]{background:var(--blue);color:#fff}.seg button.r[aria-pressed=true]{background:var(--red);color:#fff}
.switch{display:inline-flex;align-items:center;gap:8px;border:0;background:none;cursor:pointer;color:var(--ink-2);font:500 12px/1 var(--display);letter-spacing:.06em}
.switch i{position:relative;width:30px;height:17px;border-radius:999px;background:var(--stone-4);transition:background .25s}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--ink-2);transition:transform .3s var(--ease-spring),background .25s}
.switch[aria-checked=true] i{background:var(--gold-lo)}.switch[aria-checked=true] i::after{transform:translateX(13px);background:var(--gold-hi)}
.ghost{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--hair-2);
  background:transparent;cursor:pointer;color:var(--ink-2);font:500 12px/1 var(--display);letter-spacing:.05em;position:relative;overflow:hidden}
.ghost:hover{color:var(--ink);border-color:rgba(241,222,186,.3)}
.ghost:disabled{opacity:.4;cursor:default}
.ghost .fill{position:absolute;inset:0;background:var(--red-wash);transform:scaleX(0);transform-origin:left}
.ghost.holding .fill{transform:scaleX(1);transition:transform .7s linear}
.ghost span{position:relative}

/* ---------- stage ---------- */
.stage{display:grid;grid-template-columns:minmax(0,1fr) 250px minmax(0,1fr);gap:22px;align-items:stretch}
.side{padding:16px 18px 18px;position:relative;overflow:hidden}
.side::before{content:"";position:absolute;inset:0 0 auto;height:2px}
.side.blue::before{background:linear-gradient(90deg,var(--blue),transparent)}
.side.red::before{background:linear-gradient(270deg,var(--red),transparent)}
.side.acting-now{border-color:color-mix(in srgb,var(--c) 45%,transparent)}
.side.blue{--c:var(--blue);--wash:var(--blue-wash)}
.side.red{--c:var(--red);--wash:var(--red-wash)}
.side-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.side.red .side-head{flex-direction:row-reverse}
.tname{flex:1;min-width:0;border:0;background:transparent;padding:2px 0;font:700 20px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--c);
  border-bottom:1px dashed transparent;transition:border-color .2s}
.tname:hover{border-bottom-color:var(--hair-2)}.tname:focus{outline:0;border-bottom-color:var(--c)}
.side.red .tname{text-align:right}
.pips{display:flex;gap:4px}
.pips img{width:20px;height:20px;object-fit:contain;padding:2px;border-radius:5px;opacity:.22;filter:grayscale(1);transition:opacity .4s,filter .4s,background .4s}
.pips img.on{opacity:1;filter:none;background:var(--wash)}
.doors{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.side.red .doors,.side.red .seals{direction:rtl}
.door{direction:ltr;position:relative;aspect-ratio:2/3;border-radius:50% 50% 10px 10px / 32% 32% 10px 10px;overflow:hidden;
  background:var(--stone-1);border:1px solid var(--hair);transition:transform .35s var(--ease-spring),box-shadow .3s}
.door.empty{border-style:dashed;border-color:var(--hair-2);display:grid;place-items:center;align-content:center;gap:6px}
.door .code{font:700 22px/1 var(--display);color:var(--ink-3);letter-spacing:.04em}
.door.empty .code{opacity:.6}
.door.next,.seal.next{border:1px solid var(--c);outline:2px solid var(--c);animation:ripple 2s var(--ease-out) infinite}
.door.next::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent,var(--wash) 50%,transparent);
  transform:translateY(-100%);animation:sweep 2.2s var(--ease-out) infinite}
.door.next .code{color:var(--c);opacity:1}
.cue{font:600 11px/1 var(--display);letter-spacing:.24em;color:var(--c);text-transform:uppercase}
@keyframes ripple{from{outline-offset:0}to{outline-offset:9px;outline-color:transparent}}
@keyframes sweep{to{transform:translateY(100%)}}
.door .aura{position:absolute;inset:-25%;width:150%;height:150%;object-fit:cover;filter:blur(18px) saturate(1.5) brightness(.65)}
.door video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.door .face{position:absolute;left:13%;top:11%;width:74%;aspect-ratio:1;border-radius:50%;object-fit:cover;
  border:2px solid var(--c);box-shadow:0 10px 24px -6px #000}
.door.filled::after{content:"";position:absolute;inset:auto 0 0;height:56%;background:linear-gradient(transparent,rgba(8,6,10,.92) 70%);pointer-events:none}
.door .plate{position:absolute;left:0;right:0;bottom:8px;z-index:2;display:grid;justify-items:center;gap:4px;padding:0 6px}
.door .nm{font:700 12px/1.1 var(--display);letter-spacing:.06em;text-transform:uppercase;text-align:center;max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 6px #000}
.lanesel{position:relative;display:flex;align-items:center;gap:4px;height:20px;padding:0 4px 0 3px;border-radius:999px;background:rgba(0,0,0,.45);
  border:1px solid var(--hair)}
.lanesel img{width:13px;height:13px}
.lanesel select{appearance:none;border:0;background:transparent;font:600 11px/1 var(--display);letter-spacing:.1em;color:var(--ink-2);cursor:pointer;padding:0 2px}
.lanesel select:focus-visible{outline:0}.lanesel:focus-within{border-color:var(--gold)}
.lanesel option{background:var(--stone-2);color:var(--ink)}
.door .code.small{position:absolute;left:8px;top:48%;font-size:11px;z-index:2;color:rgba(255,255,255,.6)}
.door .tier{position:absolute;right:6px;top:47%;z-index:2;width:18px;height:18px;font-size:11px}
.x{position:absolute;z-index:3;top:6px;left:50%;width:24px;height:24px;margin-left:-12px;border-radius:50%;border:1px solid var(--hair-2);
  background:rgba(12,10,15,.8);color:var(--ink);font-size:11px;line-height:1;cursor:pointer;opacity:0;transform:translateY(-4px) scale(.8);
  transition:opacity .2s,transform .25s var(--ease-spring)}
.door:hover .x,.seal:hover .x,.x:focus-visible{opacity:1;transform:none}
.door.filled:hover{transform:translateY(-4px)}
.door.fresh .face{animation:arrive .9s var(--ease-spring) both}
.door.fresh .aura{animation:fadein 1.2s var(--ease-out) both}
@keyframes arrive{from{transform:scale(.4);filter:blur(8px) brightness(2);opacity:0}}
@keyframes fadein{from{opacity:0}}
/* relation flags light up while a pool hero is hovered */
.flag{position:absolute;z-index:3;left:50%;top:44%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;white-space:nowrap;
  font:700 11px/1 var(--display);letter-spacing:.16em;padding:5px 7px 4px;border-radius:4px;transition:opacity .2s,transform .3s var(--ease-spring)}
.door.rel-strong .flag,.door.rel-weak .flag,.door.rel-combo .flag{opacity:1;transform:translate(-50%,-50%)}
.door.rel-strong{outline:2px solid var(--jade);outline-offset:2px}.door.rel-strong .flag{background:var(--jade);color:#06140d}
.door.rel-weak{outline:2px solid var(--ember);outline-offset:2px}.door.rel-weak .flag{background:var(--ember);color:#1c0a03}
.door.rel-combo{outline:2px solid var(--gold);outline-offset:2px}.door.rel-combo .flag{background:var(--gold);color:#1a1206}

.seals{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--hair)}
.seal{direction:ltr;position:relative;justify-self:center;width:min(48px,100%);aspect-ratio:1;border-radius:50%;display:grid;place-items:center}
.seal.empty{border:1px dashed var(--hair-2);font:600 11px/1 var(--display);color:var(--ink-3)}
.seal.next{--c:var(--red);color:var(--red-hi)}
.seal img{width:100%;height:100%;border-radius:50%;object-fit:cover;filter:grayscale(1) brightness(.6) contrast(1.1);box-shadow:0 0 0 1px var(--hair-2)}
.seal svg{position:absolute;inset:-4px;width:calc(100% + 8px);height:calc(100% + 8px);pointer-events:none}
.seal path{fill:none;stroke:var(--red);stroke-width:5;stroke-linecap:round;filter:drop-shadow(0 1px 2px #000)}
.seal.fresh path{stroke-dasharray:80;stroke-dashoffset:80;animation:slash .45s .15s var(--ease-out) forwards}
.seal .x{top:-6px;left:auto;right:-6px;margin:0;width:20px;height:20px;font-size:11px}
@keyframes slash{to{stroke-dashoffset:0}}
.bans-lbl{display:flex;justify-content:space-between;margin-top:10px;font:600 11px/1 var(--display);letter-spacing:.2em;color:var(--ink-3)}
.side.red .bans-lbl{flex-direction:row-reverse}
.no-bans .seals,.no-bans .bans-lbl{display:none}
.seg button:disabled{opacity:.35;cursor:not-allowed}

/* ---------- edge scale ---------- */
.scale{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px 0}
.scale svg{width:210px;height:210px;overflow:visible}
.scale .track{fill:none;stroke:var(--red);stroke-width:9;opacity:.9}
.scale .arc{fill:none;stroke:var(--blue);stroke-width:9;stroke-linecap:butt;transform-origin:100px 100px;transform:rotate(90deg);transition:stroke-dasharray 1.1s var(--ease-spring),transform 1.1s var(--ease-spring)}
.scale .ticks line{stroke:var(--hair-2);stroke-width:1}
.scale .needle{transition:transform 1.1s var(--ease-spring);transform-origin:100px 100px}
.scale .needle path{fill:var(--gold-hi);stroke:var(--night);stroke-width:1.5}
.score{margin-top:-142px;height:142px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;pointer-events:none}
.score .lead{font:600 11px/1 var(--display);letter-spacing:.24em;color:var(--ink-3);margin-bottom:8px}
.score .lead.blue{color:var(--blue-hi)}.score .lead.red{color:var(--red-hi)}
.score .pair{display:flex;align-items:baseline;gap:6px;font:700 38px/1 var(--display)}
.score .pair .b{color:var(--blue)}.score .pair .r{color:var(--red)}.score .pair i{font-style:normal;font-size:20px;color:var(--ink-3)}
.headline{margin:26px 0 0;max-width:230px;font:500 14px/1.35 var(--body);color:var(--ink-2);min-height:38px}
.scale.locked svg{animation:lock 1.4s var(--ease-out)}
@keyframes lock{30%{transform:scale(1.05) rotate(4deg)}}

/* ---------- lower: pool + council ---------- */
.lower{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:22px;margin-top:22px;align-items:start}
.pool{padding:16px 18px 0;display:flex;flex-direction:column}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.search{position:relative;flex:1 1 220px;max-width:300px}
.search input{width:100%;height:36px;padding:0 36px 0 34px;border-radius:999px;border:1px solid var(--hair-2);background:var(--stone-1);outline:0;transition:border-color .2s,box-shadow .2s}
.search input:focus{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-wash)}
.search input::placeholder{color:var(--ink-3)}
.search svg{position:absolute;left:12px;top:11px;width:14px;height:14px;stroke:var(--ink-3)}
.search kbd{position:absolute;right:10px;top:9px}
.filters .chip{height:32px}
.sortsel{height:32px;border-radius:999px;border:1px solid var(--hair-2);background:var(--stone-1);padding:0 12px;font:500 12px var(--display);color:var(--ink-2)}
.count{margin-left:auto;color:var(--ink-3);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:4px 6px;max-height:520px;overflow:auto;padding:6px 4px 14px;margin:0 -4px;
  mask-image:linear-gradient(transparent,#000 10px,#000 calc(100% - 24px),transparent)}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 4px 9px;border:0;border-radius:var(--r-md);background:transparent;cursor:pointer;
  transition:background .2s,transform .25s var(--ease-spring)}
.tile:hover,.tile:focus-visible{background:var(--stone-3);transform:translateY(-3px)}
.tile .pt{position:relative;width:60px;height:60px}
.tile .pt img{width:100%;height:100%;border-radius:14px;object-fit:cover;box-shadow:0 0 0 1px var(--hair-2),0 6px 14px -6px #000;transition:filter .3s,border-radius .3s}
.tile:hover .pt img{border-radius:50%}
.tile .tier{position:absolute;right:-6px;bottom:-6px;width:18px;height:18px;font-size:11px}
.tile .tn{font:500 11.5px/1.15 var(--display);letter-spacing:.02em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.tile mark{background:none;color:var(--gold-hi);text-decoration:underline;text-underline-offset:2px}
.tile .wr{width:44px}
.tile .hint{position:absolute;top:2px;left:50%;transform:translate(-50%,4px);opacity:0;font:700 11px/1 var(--display);letter-spacing:.18em;padding:4px 6px 3px;border-radius:3px;
  color:#fff;background:var(--act,var(--blue));transition:opacity .15s,transform .25s var(--ease-spring);z-index:2}
.tile:hover .hint,.tile:focus-visible .hint{opacity:1;transform:translate(-50%,-4px)}
.tile .marks{position:absolute;left:6px;top:6px;display:flex;flex-direction:column;gap:2px;z-index:1}
.tile .marks b{font:700 11px/1 var(--display);padding:2px 3px;border-radius:3px}
.tile .marks .up{background:rgba(64,207,143,.18);color:var(--jade)}.tile .marks .dn{background:rgba(255,122,69,.18);color:var(--ember)}
.tile.rec .pt::before{content:"";position:absolute;inset:-4px;border-radius:18px;padding:2px;
  background:conic-gradient(from var(--spin,0deg),var(--gold-hi),transparent 40%,var(--gold) 60%,transparent);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 3s linear infinite}
.tile.rec .rank{position:absolute;right:6px;top:4px;font:700 11px/1 var(--display);color:var(--gold-hi)}
@property --spin{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes spin{to{--spin:360deg}}
.tile.used{cursor:not-allowed;opacity:.38}
.tile.used:hover{transform:none;background:transparent}
.tile.used .pt img{filter:grayscale(1)}
.tile .tag{position:absolute;top:30px;left:50%;transform:translateX(-50%);font:700 11px/1 var(--display);letter-spacing:.1em;padding:3px 5px 2px;border-radius:3px;color:#fff;z-index:2}
.tile .tag.B{background:var(--blue)}.tile .tag.R{background:var(--red)}.tile .tag.X{background:var(--stone-4);color:var(--red-hi)}
.empty-pool{grid-column:1/-1;padding:40px 10px;text-align:center;color:var(--ink-2)}
.empty-pool b{display:block;font:600 15px var(--display);color:var(--ink);margin-bottom:4px}
.lens{display:flex;align-items:center;gap:12px;min-height:54px;margin:0 -18px;padding:10px 18px;border-top:1px solid var(--hair);background:rgba(12,10,15,.5);
  border-radius:0 0 var(--r-lg) var(--r-lg);font-size:13px;color:var(--ink-2)}
.lens img{width:32px;height:32px;border-radius:50%}
.lens b{color:var(--ink);font:600 13px var(--display);letter-spacing:.04em}
.lens .rel{display:inline-flex;align-items:center;gap:4px;margin-left:8px}
.lens .rel i{width:6px;height:6px;border-radius:50%;display:inline-block}
.lens .keys{margin-left:auto;display:flex;gap:10px;align-items:center;color:var(--ink-3);font-size:11px;white-space:nowrap}

.council{display:flex;flex-direction:column;gap:14px}
.card{padding:16px 18px}
.card h2{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 12px;font:600 11px/1 var(--display);letter-spacing:.22em;color:var(--gold);text-transform:uppercase}
.card h2 small{font:500 11px/1 var(--display);letter-spacing:.06em;color:var(--ink-3);text-transform:none}
.feature{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;width:100%;padding:12px;border-radius:var(--r-md);cursor:pointer;text-align:left;
  border:1px solid rgba(228,181,83,.3);background:linear-gradient(120deg,var(--gold-wash),transparent 70%);transition:border-color .2s,transform .25s var(--ease-spring)}
.feature:hover{border-color:var(--gold);transform:translateY(-2px)}
.feature img{width:56px;height:56px;border-radius:50%;border:2px solid var(--gold)}
.feature b{display:block;font:700 16px/1.1 var(--display);letter-spacing:.04em}
.score-pill{font:700 13px/1 var(--display);color:var(--jade);padding:6px 8px;border-radius:6px;background:rgba(64,207,143,.12)}
.reasons{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.reasons span{font-size:11px;line-height:1;padding:4px 7px;border-radius:999px;background:var(--stone-3);color:var(--ink-2)}
.alts{margin:10px 0 0;padding:0;list-style:none}
.alts button{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;width:100%;padding:7px 8px;border:0;border-radius:8px;background:transparent;cursor:pointer;text-align:left}
.alts button:hover{background:var(--stone-3)}
.alts img{width:28px;height:28px;border-radius:50%}
.alts b{font:600 13px var(--display);letter-spacing:.03em}.alts small{display:block;font-size:11px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alts .num{font-size:12px;color:var(--jade)}
.tug{margin-bottom:12px}
.tug:last-child{margin-bottom:0}
.tug-h{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;margin-bottom:5px}
.tug-h span{font:600 11px/1 var(--display);letter-spacing:.16em;color:var(--ink-2)}
.tug-h .num{font-size:12px}.tug-h .b{color:var(--blue)}.tug-h .r{color:var(--red)}
.tug-bar{position:relative;height:6px;border-radius:3px;background:var(--red);overflow:visible}
.tug-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px 0 0 3px;background:var(--blue);transition:width 1s var(--ease-spring)}
.tug-bar::after{content:"";position:absolute;left:50%;top:-3px;width:1px;height:12px;background:var(--night)}
.tug-bar em{position:absolute;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;background:var(--gold-hi);transform:rotate(45deg);transition:left 1s var(--ease-spring);box-shadow:0 0 0 2px var(--night)}
.tug small{display:block;margin-top:5px;font-size:11.5px;color:var(--ink-3)}
.lotus{display:grid;grid-template-columns:230px 1fr;gap:10px;align-items:center}
.lotus svg{width:230px;height:auto}
.lotus .petal{transition:d .9s var(--ease-spring)}
.lotus text{font:500 11px var(--display);letter-spacing:.08em;fill:var(--ink-3);text-transform:uppercase}
.legend{display:grid;gap:6px;font-size:12px;color:var(--ink-2)}
.legend .row{display:grid;grid-template-columns:1fr 26px 26px;gap:4px;align-items:center}
.legend .row b{font:600 11px var(--display);text-align:right}
.legend .row:first-child b{font-size:11px;letter-spacing:.14em}
.coord{display:grid;grid-template-columns:1fr auto 1fr;gap:6px 12px;font-size:12.5px}

/* the coach spans the page under the pool: its reads run to a few hundred words */
.coach{margin-top:22px;padding:22px 26px 24px;border-color:rgba(228,181,83,.22)}
.coach-h{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.coach-h h2{margin:0;font:600 11px/1 var(--display);letter-spacing:.22em;color:var(--gold);text-transform:uppercase}
.coach-h small{color:var(--ink-3);font:500 11px/1 var(--display);letter-spacing:.06em}
.coach-h .ask{margin-left:auto}
.coach-h p{margin:0;color:var(--ink-2);font-size:14px}
.coach p{margin:0}
.top-read{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:40px;align-items:start;margin-top:18px}
.verdict{max-width:74ch}
.tally{padding:16px 18px;border-radius:var(--r-md);background:var(--stone-1);border:1px solid var(--hair)}
.tally small{display:block;font:600 11px/1 var(--display);letter-spacing:.2em;color:var(--ink-3);text-transform:uppercase}
.tally .pair{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;font:700 34px/1 var(--display);font-variant-numeric:tabular-nums}
.tally .pair .b{color:var(--blue)}.tally .pair .r{color:var(--red)}
.tally .meter{position:relative;height:5px;margin:10px 0 8px;border-radius:3px;background:var(--red)}
.tally .meter i{position:absolute;inset:0 auto 0 0;border-radius:3px 0 0 3px;background:var(--blue)}
.tally .names{display:flex;justify-content:space-between;gap:8px;font:500 11px/1.3 var(--display);letter-spacing:.06em;color:var(--ink-2)}
.tally p{margin-top:12px;font-size:12.5px;line-height:1.5;color:var(--ink-3)}
.verdict .lead{font:600 21px/1.4 var(--display);letter-spacing:.005em;color:var(--ink);text-wrap:pretty}
.verdict .rest{margin-top:10px;font-size:15px;line-height:1.65;color:var(--ink-2);text-wrap:pretty}
.reads{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.read{padding:16px 18px 18px;border-radius:var(--r-md);background:var(--stone-1);border:1px solid var(--hair)}
.read h3{display:flex;align-items:center;gap:8px;margin:0 0 10px;font:600 11px/1 var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--c)}
.read h3::before{content:"";width:7px;height:7px;background:var(--c);transform:rotate(45deg)}
.read.blue{--c:var(--blue-hi)}.read.red{--c:var(--red-hi)}
.read p{font-size:14px;line-height:1.65;color:var(--ink-2);text-wrap:pretty}
.read p b{display:block;margin-bottom:6px;font-weight:500;color:var(--ink)}
.watch{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:baseline;margin-top:14px;padding:14px 18px;border-radius:var(--r-md);background:var(--gold-wash)}
.watch span{font:600 11px/1.4 var(--display);letter-spacing:.2em;color:var(--gold-hi);text-transform:uppercase;white-space:nowrap}
.watch p{font-size:14.5px;line-height:1.6;color:var(--ink)}
.coach .say{opacity:0;transform:translateY(6px);animation:say .6s var(--ease-out) forwards}
@keyframes say{to{opacity:1;transform:none}}
.ask{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 18px;border:0;border-radius:999px;cursor:pointer;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#1a1206;font:700 12px/1 var(--display);letter-spacing:.14em;
  box-shadow:0 8px 18px -10px #000,inset 0 -2px 0 rgba(0,0,0,.15);transition:transform .2s var(--ease-spring)}
.ask:hover{transform:translateY(-1px)}.ask:active{transform:translateY(1px)}
.ask.quiet{background:transparent;color:var(--gold-hi);box-shadow:inset 0 0 0 1px rgba(228,181,83,.4)}
.ink{display:inline-flex;gap:5px;margin-left:4px}
.ink i{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:ink 1.2s infinite}
.ink i:nth-child(2){animation-delay:.15s}.ink i:nth-child(3){animation-delay:.3s}
@keyframes ink{0%,100%{opacity:.2;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
.fly{position:fixed;z-index:50;border-radius:50%;pointer-events:none;border:2px solid var(--gold-hi);box-shadow:0 14px 30px -8px #000}

@media (max-width:1180px){
  .stage{grid-template-columns:1fr}.scale{order:-1}
  .lower{grid-template-columns:1fr}
  .rail{grid-template-columns:1fr}.turn,.tools,.acting{grid-column:1;grid-row:auto;justify-self:center}
}
@media (max-width:640px){
  main{padding:14px 16px 40px}
  .side{padding:12px}.doors,.seals{gap:5px}
  .door .face{left:8%;width:84%}.door .nm{font-size:11px}.lanesel{display:none}
  .notches{gap:3px}.notches .pick{width:7px}.notches .gap{width:8px}
  .lens .keys{display:none}.reads,.top-read{grid-template-columns:1fr}.top-read{gap:16px}.coach{padding:18px 16px}.coach-h .ask{margin-left:0}.verdict .lead{font-size:18px}.watch{grid-template-columns:1fr}.lotus{grid-template-columns:1fr;justify-items:center}
  .search{max-width:none}
  .scale svg{width:160px;height:160px}.score{margin-top:-108px;height:108px}.score .pair{font-size:30px}.headline{margin-top:18px}
}
</style></head><body>
<main class="page">
 <section class="rail" aria-label="Draft order">
  <div class="tools"><button class="ghost" id="undo" disabled title="Undo your last pick or ban (Ctrl+Z)"><span>↶ Undo</span></button>
   <button class="ghost" id="reset" title="Hold to clear the board"><span class="fill"></span><span id="resetLbl">Hold to reset</span></button></div>
  <div class="turn" aria-live="polite"><span class="eyebrow" id="phase">Ban phase 1</span><h1 id="turnLine">…</h1><span class="step num" id="stepNo"></span></div>
  <div class="acting">
   <button class="switch" id="bansOn" role="switch" aria-checked="true" title="Off: picks only, in the 10-step snake order"><i></i>Bans</button>
   <button class="switch" id="follow" role="switch" aria-checked="true"><i></i>Follow draft order</button>
   <div class="seg" id="sideSeg" aria-label="Acting side"><button class="b" data-s="blue">BLUE</button><button class="r" data-s="red">RED</button></div>

  </div>

 </section>

 <section class="stage">

  <div class="scale" id="scale">
   <svg viewBox="0 0 200 200" aria-hidden="true">
    <g class="ticks" id="ticks"></g>
    <circle class="track" cx="100" cy="100" r="84"/>
    <circle class="arc" id="arc" cx="100" cy="100" r="84" stroke-dasharray="263.9 527.8"/>
    <g class="needle" id="needle"><path d="M100 8 l6 8 -6 8 -6 -8z"/></g><g class="needle" id="needle2" style="transform:rotate(180deg)"><path d="M100 8 l6 8 -6 8 -6 -8z"/></g>
   </svg>
   <div class="score"><span class="lead" id="lead">EVEN</span><div class="pair"><span class="b num" id="eb">50</span><i>:</i><span class="r num" id="er">50</span></div></div>
   <p class="headline" id="headline">The draft is even</p>
  </div>

 </section>

 <section class="lower">
  <div class="pool panel">
   <div class="filters">
    <label class="search"><span class="sr">Search heroes</span><svg viewBox="0 0 16 16" fill="none" stroke-width="2"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg>
     <input id="q" placeholder="Search 133 heroes" autocomplete="off"><kbd>/</kbd></label>
    <div id="roles" style="display:contents"></div>
   </div>
   <div class="filters" id="lanes"></div>
   <div class="grid" id="grid"></div>
   <div class="lens" id="lens"></div>
  </div>
  <aside class="council">
   <div class="card panel" id="next"></div>
   <div class="card panel" id="edge"></div>
   <div class="card panel" id="profile"></div>
   <div class="card panel" id="coord"></div>
  </aside>
 </section>
 <section class="coach panel" id="coach" aria-live="polite"></section>
</main>
<script src="/app.js"></script>
<script src="kit.js"></script>
<script>
const TOURNAMENT=[...'BRBRBR'].map(s=>['ban',s,0]).concat([...'BRRBBR'].map(s=>['pick',s,1]),[...'RBRB'].map(s=>['ban',s,2]),[...'RBBR'].map(s=>['pick',s,3]));
// With bans off the board is the engine's own 10-pick snake, like the original page.
const PICKS_ONLY=[...'BRRBBR'].map(s=>['pick',s,1]).concat([...'RBBR'].map(s=>['pick',s,3]));
let bansOn=store.get('jongrai-bans')!=='off';
const order=()=>bansOn?TOURNAMENT:PICKS_ONLY;
const PHASES=['Ban phase 1','Pick phase 1','Ban phase 2','Pick phase 2'];
const SIDE={B:'blue',R:'red'},LANES=['EXP','JUNGLE','MID','GOLD','ROAM'];
const ROLE_ICON={TANK:'Emblem_Tank.png',FIGHTER:'Emblem_Fighter.png',ASSASSIN:'Emblem_Assassin.png',MAGE:'Emblem_Mage.png',MARKSMAN:'Emblem_Marksman.png',SUPPORT:'Emblem_Support.png'};
const VIDEOS={aamon:'Aamon.mp4',akai:'Akai.mp4',granger:'Granger.mp4',claude:'Claude.mp4',marcel:'Marcel.mp4'};
const TIER_ORDER='SABCD';
const SORT='<select class="sortsel" id="sort" aria-label="Sort heroes"><option value="tier">Sort: tier</option><option value="win">Sort: win rate</option><option value="ban">Sort: ban rate</option><option value="name">Sort: A–Z</option></select>';
let heroes=[],byName={},state={version:0,blue:{picks:[],bans:[]},red:{picks:[],bans:[]}};
let sortBy='tier',follow=true,manual={side:'blue',kind:'pick'},role='',lane='',undoStack=[],recs=[],fly=null,seen=new Set();
const other=s=>s==='blue'?'red':'blue';
const cap=s=>s[0].toUpperCase()+s.slice(1);
const pickNames=s=>state[s].picks.map(p=>p.name);
const key=n=>n.toLowerCase();

/** The first step of the 20-step order a side has not filled yet. Works even when the board was filled out of order. */
function currentStep(){
 const need={blue:{pick:0,ban:0},red:{pick:0,ban:0}};
 for(let i=0;i<order().length;i++){const[k,s]=order()[i],side=SIDE[s];need[side][k]++;
  if(state[side][k+'s'].length<need[side][k])return i}
 return order().length;
}
function acting(){const i=currentStep();if(!follow||i>=order().length)return manual;const[k,s]=order()[i];return{side:SIDE[s],kind:k}}

/* ---------- rail ---------- */
function drawRail(){
 const i=currentStep(),a=acting(),done=i>=order().length;
 const need={blue:{pick:0,ban:0},red:{pick:0,ban:0}};
 $('#notches').innerHTML=order().map(([k,s,ph],n)=>{const side=SIDE[s],idx=need[side][k]++,list=state[side][k+'s'],hit=list[idx];
  const name=hit?(hit.name||hit):'';
  return(n&&ph!==order()[n-1][2]?'<li class="gap" aria-hidden="true"></li>':'')
   +`<li class="${k} ${s}${hit?' done':''}${n===i?' now':''}" title="${n+1}. ${cap(side)} ${k}${name?': '+esc(name):''}"></li>`}).join('');
 $('#phase').textContent=done?'Draft complete':PHASES[order()[i][2]];
 $('#turnLine').innerHTML=done?'Both sides <b>locked</b>':`<b class="${a.side}">${cap(a.side)}</b> ${a.kind}s${follow?'':' <small style="font-size:12px;color:var(--ink-3);letter-spacing:.1em">· FREE MODE</small>'}`;
 const total=order().length;$('#stepNo').textContent=done?`${total} / ${total}`:`STEP ${String(i+1).padStart(2,'0')} / ${total}`;
 document.querySelectorAll('#sideSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.s===a.side));
 document.querySelectorAll('#kindSeg button').forEach(b=>{b.setAttribute('aria-pressed',b.dataset.k===a.kind);b.disabled=b.dataset.k==='ban'&&!bansOn});
 document.querySelector('main').classList.toggle('no-bans',!bansOn&&!state.blue.bans.length&&!state.red.bans.length);
 document.querySelectorAll('.side').forEach(el=>el.classList.toggle('acting-now',!done&&el.id==='side-'+a.side));
 document.documentElement.style.setProperty('--act',a.side==='blue'?'var(--blue)':'var(--red)');
}

/* ---------- stage ---------- */
const face=n=>{const h=byName[n];return h&&h.icon?icon(h.icon):''};
function door(t,p,i,next){
 const code=(t==='blue'?'B':'R')+(i+1);
 if(!p)return[`${code}|${next}`,`<div class="door empty${next?' next':''}" data-slot="${code}"><span class="code">${code}</span>${next?'<span class="cue">Picking</span>':''}</div>`];
 const h=byName[p.name]||{lanes:[]},v=VIDEOS[key(p.name)],li=laneIcon(p.lane);
 const opts=[...h.lanes,...LANES.filter(l=>!h.lanes.includes(l))].map(l=>`<option value="${l}"${l===p.lane?' selected':''}>${l}${h.lanes.includes(l)?'':' · flex'}</option>`).join('');
 const art=v?`<video src="/video/${v}" autoplay muted loop playsinline preload="metadata" aria-hidden="true"></video>`
  :`<img class="aura" src="${face(p.name)}" alt=""><img class="face" src="${face(p.name)}" alt="">`;
 return[`${p.name}|${p.lane}`,`<div class="door filled" data-hero="${esc(p.name)}">${art}
  <span class="code small">${code}</span>${h.tier?`<span class="tier ${esc(h.tier)}">${esc(h.tier)}</span>`:''}<span class="flag"></span>
  <div class="plate"><b class="nm">${esc(p.name)}</b><label class="lanesel">${li?`<img src="/icons/${li}" alt="">`:''}<span class="sr">Lane for ${esc(p.name)}</span>
  <select data-lane data-t="${t}" data-hero="${esc(p.name)}">${opts}</select></label></div>
  <button class="x" data-rm data-t="${t}" data-hero="${esc(p.name)}" aria-label="Remove ${esc(p.name)}">✕</button></div>`];
}
function seal(t,n,i,next){
 if(!n)return[`|${next}`,`<div class="seal empty${next?' next':''}">${i+1}</div>`];
 return[n,`<div class="seal" data-hero="${esc(n)}" title="${esc(n)} banned"><img src="${face(n)}" alt="${esc(n)} (banned)">
  <svg viewBox="0 0 56 56" aria-hidden="true"><path d="M12 44 Q 26 30 45 11"/></svg>
  <button class="x" data-rm data-t="${t}" data-hero="${esc(n)}" aria-label="Lift ban on ${esc(n)}">✕</button></div>`];
}
/** Replaces only the slots whose content changed, so hero videos keep playing and fresh arrivals can animate. */
function patch(box,parts,fresh){
 if(box.children.length!==parts.length)box.innerHTML=parts.map(()=>'<div></div>').join('');
 parts.forEach(([k,html],i)=>{const old=box.children[i];if(old.dataset.k===k)return;
  const tmp=document.createElement('div');tmp.innerHTML=html;const el=tmp.firstElementChild;el.dataset.k=k;
  const h=el.dataset.hero;if(h&&fresh&&!seen.has(h))el.classList.add('fresh');old.replaceWith(el)});
}
let coordCache=null;
function drawSides(fresh){
 const a=acting(),i=currentStep(),done=i>=order().length;
 for(const t of['blue','red']){
  const el=$('#side-'+t);
  if(!el.firstChild){
   const saved=store.get('jongrai-name-'+t)||(t==='blue'?'Blue side':'Red side');
   el.innerHTML=`<div class="side-head"><input class="tname" data-team="${t}" value="${esc(saved)}" aria-label="${cap(t)} team name" spellcheck="false"><div class="pips" data-pips></div></div>
    <div class="doors"></div><div class="seals"></div><div class="bans-lbl"><span>BANS</span><span class="num" data-bc></span></div>`;
  }
  const nextPick=!done&&a.side===t&&a.kind==='pick',nextBan=!done&&a.side===t&&a.kind==='ban';
  const picks=Array.from({length:5},(_,j)=>door(t,state[t].picks[j],j,nextPick&&j===state[t].picks.length));
  const bans=Array.from({length:5},(_,j)=>seal(t,state[t].bans[j],j,nextBan&&j===state[t].bans.length));
  patch(el.querySelector('.doors'),picks,fresh);patch(el.querySelector('.seals'),bans,fresh);
  el.querySelector('[data-bc]').textContent=state[t].bans.length+' / 5';
 }
 drawPips();
}
function drawPips(){
 for(const t of['blue','red']){
  const miss=coordCache?coordCache[t].missingLanes:LANES;
  $('#side-'+t+' [data-pips]').innerHTML=LANES.map(l=>`<img src="/icons/${laneIcon(l)}" alt="${l}${miss.includes(l)?' open':' covered'}" title="${l}: ${miss.includes(l)?'open':'covered'}" class="${miss.includes(l)?'':'on'}">`).join('');
 }
}

/* ---------- pool ---------- */
function usedMap(){const m={};for(const t of['blue','red']){state[t].picks.forEach((p,i)=>m[p.name]=(t==='blue'?'B':'R')+(i+1));state[t].bans.forEach(n=>m[n]='X')}return m}
/** Pool heroes that counter (up) or are countered by (dn) the enemy's current picks. */
function relations(h,side){
 const foe=pickNames(other(side)).map(n=>byName[n]).filter(Boolean),mine=pickNames(side).map(n=>byName[n]).filter(Boolean);
 return{strong:foe.filter(f=>h.counters.includes(key(f.name))).map(f=>f.name),
  weak:foe.filter(f=>f.counters.includes(key(h.name))).map(f=>f.name),
  combo:mine.filter(m=>h.synergies.includes(key(m.name))||m.synergies.includes(key(h.name))).map(m=>m.name)};
}
function drawGrid(){
 const q=$('#q').value.trim().toLowerCase(),used=usedMap(),a=acting(),sort=sortBy;
 const list=heroes.filter(h=>h.name.toLowerCase().includes(q)&&(!role||h.roles.includes(role))&&(!lane||h.lanes.includes(lane)))
  .sort((x,y)=>sort==='win'?y.winRate-x.winRate:sort==='ban'?y.banRate-x.banRate:sort==='name'?x.name.localeCompare(y.name)
   :TIER_ORDER.indexOf(x.tier)-TIER_ORDER.indexOf(y.tier)||y.winRate-x.winRate);
 const hl=n=>{if(!q)return esc(n);const i=n.toLowerCase().indexOf(q);return esc(n.slice(0,i))+'<mark>'+esc(n.slice(i,i+q.length))+'</mark>'+esc(n.slice(i+q.length))};
 $('#count').textContent=`${list.filter(h=>!used[h.name]).length} available · ${list.length} shown`;
 $('#grid').innerHTML=list.length?list.map(h=>{const u=used[h.name],r=relations(h,a.side),rank=recs.indexOf(h.name);
  const wr=Math.max(0,Math.min(100,(h.winRate-40)*5));
  return`<button class="tile${u?' used':''}${rank>=0&&!u?' rec':''}" data-h="${esc(h.name)}"${u?' aria-disabled="true"':''}
   aria-label="${esc(h.name)}, tier ${esc(h.tier)}, ${h.winRate.toFixed(1)}% win${u?', '+(u==='X'?'banned':'picked'):''}">
   <span class="hint" aria-hidden="true">${a.kind.toUpperCase()}</span>
   ${rank>=0&&!u?`<span class="rank num" title="Engine pick #${rank+1}">#${rank+1}</span>`:''}
   ${!u&&(r.strong.length||r.weak.length)?`<span class="marks">${r.strong.length?`<b class="up" title="Strong against ${esc(r.strong.join(', '))}">▲${r.strong.length}</b>`:''}${r.weak.length?`<b class="dn" title="Weak against ${esc(r.weak.join(', '))}">▼${r.weak.length}</b>`:''}</span>`:''}
   <span class="pt"><img src="${icon(h.icon)}" alt=""><span class="tier ${esc(h.tier)}">${esc(h.tier)}</span></span>
   ${u?`<span class="tag ${u[0]}">${u==='X'?'BAN':u}</span>`:''}
   <span class="tn">${hl(h.name)}</span><span class="wr ${h.winRate>=51?'up':h.winRate<49?'down':''}"><i style="width:${wr}%"></i></span></button>`}).join('')
  :`<div class="empty-pool"><b>No hero matches “${esc($('#q').value)}”</b>Try part of the name, or clear the role and lane filters.<br><br><button class="chip" id="clearAll">Clear filters</button></div>`;
 lens(null);
}
function lens(h){
 const keys=`<span class="keys"><span><kbd>/</kbd> search</span><span><kbd>↵</kbd> ${acting().kind} first</span><span><kbd>Ctrl</kbd><kbd>Z</kbd> undo</span></span>`;
 document.querySelectorAll('.door[class*=rel-]').forEach(d=>d.classList.remove('rel-strong','rel-weak','rel-combo'));
 if(!h){$('#lens').innerHTML=`<span>Hover a hero to see how it fits this board.</span>${keys}`;return}
 const a=acting(),r=relations(h,a.side);
 const mark=(names,cls,label)=>names.forEach(n=>{const d=document.querySelector(`.door[data-hero="${CSS.escape(n)}"]`);if(d){d.classList.add(cls);d.querySelector('.flag').textContent=label}});
 mark(r.strong,'rel-strong','STRONG VS');mark(r.weak,'rel-weak','THREAT');mark(r.combo,'rel-combo','COMBO');
 const rel=(names,c,l)=>names.length?`<span class="rel"><i style="background:${c}"></i>${l} ${esc(names.join(', '))}</span>`:'';
 $('#lens').innerHTML=`<img src="${icon(h.icon)}" alt=""><div><b>${esc(h.name)}</b> · ${esc(h.roles.join(' / ').toLowerCase())} · ${esc(h.lanes.join(' / ').toLowerCase())} · <span class="num">${h.winRate.toFixed(2)}%</span> win${h.banRate?` · <span class="num">${h.banRate.toFixed(1)}%</span> ban`:''}<br>
  ${rel(r.strong,'var(--jade)','strong vs')}${rel(r.weak,'var(--ember)','weak vs')}${rel(r.combo,'var(--gold)','combos with')}${!r.strong.length&&!r.weak.length&&!r.combo.length?`<span style="color:var(--ink-3)">${esc(h.tip||'No direct relation to the heroes on the board yet.')}</span>`:''}</div>${keys}`;
}

/* ---------- council ---------- */
async function drawNext(){
 const a=acting(),done=currentStep()>=order().length&&follow;
 if(done){recs=[];$('#next').innerHTML=`<h2>Next move <small>draft complete</small></h2><p style="margin:0;color:var(--ink-2)">All twenty steps are in. Ask Jongrai for the read below, or tap a slot to change it.</p>`;return}
 const list=await call(`/api/${a.kind==='pick'?'suggest':'bans'}?side=${a.side}`);
 if(list.error||!Array.isArray(list)){$('#next').innerHTML=`<h2>Next move</h2><p style="margin:0;color:var(--ember)">${esc(list.error||'No suggestions')}</p>`;return}
 recs=list.map(s=>s.hero);
 const [top,...rest]=list,tag=`<small>${cap(a.side)} ${a.kind} · engine ranked</small>`;
 $('#next').innerHTML=top?`<h2>${a.kind==='pick'?'Best pick':'Best ban'} ${tag}</h2>
  <button class="feature" data-sg="${esc(top.hero)}"><img src="${face(top.hero)}" alt=""><span><b>${esc(top.hero)}</b><span class="reasons">${top.reasons.map(r=>`<span>${esc(r)}</span>`).join('')}</span></span><span class="score-pill num">${esc(top.score)}</span></button>
  <ul class="alts">${rest.map(s=>`<li><button data-sg="${esc(s.hero)}"><img src="${face(s.hero)}" alt=""><span><b>${esc(s.hero)}</b><small>${esc(s.reasons.join(' · ')||'—')}</small></span><span class="num">${esc(s.score)}</span></button></li>`).join('')}</ul>`
  :`<h2>Next move ${tag}</h2><p style="margin:0;color:var(--ink-2)">Nothing left to suggest for this step.</p>`;
 drawGrid();
}
function petal(i,n,v,shift){
 const a=(-90+i*360/n+shift)*Math.PI/180,r=14+v/10*70,w=.2,c=100;
 const P=(ang,rad)=>[(c+Math.cos(ang)*rad).toFixed(1),(c+Math.sin(ang)*rad).toFixed(1)].join(' ');
 return`M${c} ${c} Q${P(a-w,r*.8)} ${P(a,r)} Q${P(a+w,r*.8)} ${c} ${c}Z`;
}
async function drawAnalysis(){
 const a=await call('/api/analysis');if(a.error){toast(a.error,'var(--ember)');return}
 lastA=a;coordCache=a.coordination;drawPips();
 const C=527.8,b=a.blueEdge;
 // Blue's arc is centred on the left (Blue's side of the screen); both boundaries move as the edge shifts.
 $('#arc').setAttribute('stroke-dasharray',`${C*b/100} ${C}`);$('#arc').style.transform=`rotate(${180-b*1.8}deg)`;
 $('#needle').style.transform=`rotate(${b*1.8-90}deg)`;$('#needle2').style.transform=`rotate(${-90-b*1.8}deg)`;
 countTo($('#eb'),a.blueEdge);countTo($('#er'),a.redEdge);
 $('#lead').textContent=a.lead==='even'?'EVEN':a.lead.toUpperCase()+' EDGE';$('#lead').className='lead '+a.lead;
 $('#headline').textContent=a.headline;
 const locked=state.blue.picks.length===5&&state.red.picks.length===5;
 $('#scale').classList.toggle('locked',locked);
 $('#edge').innerHTML=`<h2>Edge breakdown <small>blue share per category</small></h2>`+a.categories.map(c=>{const s=Math.round(c.blueShare);
  return`<div class="tug"><div class="tug-h"><span class="num b">${s}</span><span>${esc(c.name)}</span><span class="num r">${100-s}</span></div>
  <div class="tug-bar" role="img" aria-label="${esc(c.name)}: blue ${s}, red ${100-s}"><i style="width:${c.blueShare}%"></i><em style="left:${c.blueShare}%"></em></div><small>${esc(c.detail)}</small></div>`}).join('');
 const n=a.profile.length;
 const rings=[25,50,75].map(p=>`<circle cx="100" cy="100" r="${14+p*.7}" fill="none" stroke="var(--hair)" stroke-dasharray="2 3"/>`).join('');
 const labels=a.profile.map((x,i)=>{const g=(-90+i*360/n)*Math.PI/180;return`<text x="${(100+Math.cos(g)*96).toFixed(1)}" y="${(103+Math.sin(g)*96).toFixed(1)}" text-anchor="middle">${esc(x.name)}</text>`}).join('');
 const petals=(side,col,shift)=>a.profile.map((x,i)=>`<path class="petal" d="${petal(i,n,x[side],shift)}" fill="${col}" fill-opacity=".28" stroke="${col}" stroke-width="1.2"><title>${esc(x.name)} · ${cap(side)} ${x[side]}</title></path>`).join('');
 $('#profile').innerHTML=`<h2>Lotus profile <small>nine axes, 0–10</small></h2><div class="lotus"><svg viewBox="-38 -8 276 216" role="img" aria-label="Tactical profile, blue against red">${rings}${petals('blue','#4d8dff',-7)}${petals('red','#ff5062',7)}<circle cx="100" cy="100" r="5" fill="var(--gold)"/>${labels}</svg>
  <div class="legend"><div class="row"><span></span><b style="color:var(--blue)">BLU</b><b style="color:var(--red)">RED</b></div>${a.profile.map(x=>`<div class="row"><span>${esc(x.name)}</span><b class="num">${x.blue}</b><b class="num">${x.red}</b></div>`).join('')}</div></div>`;
 const B=a.coordination.blue,R=a.coordination.red,yn=v=>v?'<span class="yes">✓ yes</span>':'<span class="no">✕ no</span>';
 const row=(k,bv,rv)=>`<span class="v">${bv}</span><span class="k">${k}</span><span class="v r">${rv}</span>`;
 $('#coord').innerHTML=`<h2>Coordination <small><span style="color:var(--blue)">${Math.round(B.score)}</span> / <span style="color:var(--red)">${Math.round(R.score)}</span> of 100</small></h2><div class="coord">
  ${row('Lanes',B.lanesCovered+' / 5',R.lanesCovered+' / 5')}${row('Frontline',yn(B.hasTank),yn(R.hasTank))}${row('Carry',yn(B.hasMarksmanOrMage),yn(R.hasMarksmanOrMage))}
  ${row('Synergies',B.synergyPairs,R.synergyPairs)}${row('Lockdown',B.heavyControl,R.heavyControl)}${row('Spike',B.spikeTiming.toLowerCase(),R.spikeTiming.toLowerCase())}
  <div class="needs"><div>${B.missingLanes.length?`needs <span>${esc(B.missingLanes.join(', ').toLowerCase())}</span>`:'<span class="yes">every lane covered</span>'}</div><div style="text-align:right">${R.missingLanes.length?`needs <span>${esc(R.missingLanes.join(', ').toLowerCase())}</span>`:'<span class="yes">every lane covered</span>'}</div></div></div>`;
}
let coachKey='',lastA=null;
function drawCoach(){
 const b=state.blue.picks.length,r=state.red.picks.length,sig=JSON.stringify([state.blue,state.red]);
 if(coachKey&&coachKey!==sig)coachKey='';
 if(coachKey)return;
 const ready=b===5&&r===5;
 $('#coach').innerHTML=`<div class="coach-h"><h2>Jongrai's wisdom</h2><small>AI coach · patch <span data-patch></span></small>
  <p>${ready?'Ten heroes are locked. Jongrai can read the whole draft now.':`Reads the board once all ten picks are in: <span class="num" style="color:var(--ink)">${b} : ${r}</span> so far.`}</p>
  <button class="ask${ready?'':' quiet'}" id="ask">${ready?'Ask Jongrai':'Read it early'}</button></div>`;
 fillMeta();
}
async function askCoach(refresh){
 const sig=JSON.stringify([state.blue,state.red]);coachKey=sig;
 $('#coach').innerHTML=`<div class="coach-h"><h2>Jongrai's wisdom</h2><p>Reading the draft<span class="ink"><i></i><i></i><i></i></span></p></div>`;
 const done=state.blue.picks.length===5&&state.red.picks.length===5;
 const w=await call('/api/wisdom?'+(done?'':'force=1&')+(refresh?'refresh=1':''),{post:true});
 if(coachKey!==sig)return;
 if(w.error){$('#coach').innerHTML=`<div class="coach-h"><h2>Jongrai's wisdom</h2><small>coach off</small><p style="color:var(--ember)">${esc(w.error)}</p></div>`;return}
 if(!w.ready){coachKey='';drawCoach();return}
 const [lead,rest]=firstSentence(w.verdict);
 const read=(t,txt,i)=>{if(!txt)return'';const[a,b]=firstSentence(txt);
  return`<article class="read ${t} say" style="animation-delay:${.2+i*.15}s"><h3>${esc(teamName(t))}</h3><p><b>${esc(a)}</b>${esc(b)}</p></article>`};
 $('#coach').innerHTML=`<div class="coach-h"><h2>Jongrai's wisdom</h2><small>verdict · patch <span data-patch></span></small><button class="ask quiet" id="reread">Re-read the draft</button></div>
  <div class="top-read"><div class="verdict say"><p class="lead">${esc(lead)}</p>${rest?`<p class="rest">${esc(rest)}</p>`:''}</div>${tally()}</div>
  <div class="reads">${read('blue',w.blue,0)}${read('red',w.red,1)}</div>
  ${w.closing?`<div class="watch say" style="animation-delay:.55s"><span>Key to watch</span><p>${esc(w.closing)}</p></div>`:''}`;
 fillMeta();
}
/** The engine's own score beside the coach's opinion, so the two can be compared at a glance. */
const tally=()=>lastA?`<aside class="tally say" style="animation-delay:.1s"><small>Engine edge</small><div class="pair"><span class="b">${lastA.blueEdge}</span><span class="r">${lastA.redEdge}</span></div>
  <div class="meter"><i style="width:${lastA.blueEdge}%"></i></div><div class="names"><span>${esc(teamName('blue'))}</span><span>${esc(teamName('red'))}</span></div><p>${esc(lastA.headline)}</p></aside>`:'';
/** Splits off the first sentence so each read opens with one line you can scan. */
const firstSentence=t=>{const m=String(t||'').match(/^(.+?[.!?])\s+(\S[\s\S]*)$/);return m?[m[1],m[2]]:[String(t||''),'']};
const teamName=t=>(document.querySelector(`.tname[data-team=${t}]`)||{}).value||cap(t);

/* ---------- actions ---------- */
function refresh(fresh){drawRail();drawSides(fresh);drawGrid();drawNext();drawAnalysis();drawCoach();
 for(const t of['blue','red']){state[t].picks.forEach(p=>seen.add(p.name));state[t].bans.forEach(n=>seen.add(n))}
 if(fly)flyIn();}
function adopt(j){
 const before=JSON.stringify([state.blue,state.red]);
 if(j.state)state=j.state;else if(!j.error)state=j;
 if(j.error)toast(j.error,'var(--ember)');
 if(JSON.stringify([state.blue,state.red])!==before)refresh(true);else fly=null;
 const used=usedMap();[...seen].forEach(n=>{if(!used[n])seen.delete(n)});
}
async function act(path,side,name,extra=''){
 const j=await call(`/api/${path}?side=${side}&hero=${encodeURIComponent(name)}&v=${state.version}${extra}`,{post:true});
 if(!j.error&&(path==='pick'||path==='ban'))undoStack.push({side,name});
 $('#undo').disabled=!undoStack.length;adopt(j);
}
function choose(name,el){
 const a=acting();
 const img=el&&el.querySelector('img');
 if(img&&!matchMedia('(prefers-reduced-motion: reduce)').matches)fly={name,rect:img.getBoundingClientRect(),src:img.src};
 act(a.kind,a.side,name);
}
/** The clicked portrait flies from the pool into its new slot. */
function flyIn(){
 const f=fly;fly=null;
 const target=document.querySelector(`.door[data-hero="${CSS.escape(f.name)}"] .face, .door[data-hero="${CSS.escape(f.name)}"] video, .seal[data-hero="${CSS.escape(f.name)}"] img`);
 if(!target)return;
 const to=target.getBoundingClientRect(),ghost=Object.assign(document.createElement('img'),{src:f.src,className:'fly'});
 Object.assign(ghost.style,{left:f.rect.left+'px',top:f.rect.top+'px',width:f.rect.width+'px',height:f.rect.height+'px'});
 document.body.append(ghost);target.style.opacity=0;
 const dx=to.left-f.rect.left,dy=to.top-f.rect.top,s=Math.min(to.width,to.height)/f.rect.width;
 ghost.animate([{transform:'none',opacity:1},{transform:`translate(${dx*.5}px,${dy*.5-60}px) scale(${(1+s)/2})`,opacity:1,offset:.55},
  {transform:`translate(${dx+(to.width-f.rect.width*s)/2}px,${dy+(to.height-f.rect.height*s)/2}px) scale(${s})`,opacity:.9}],
  {duration:620,easing:'cubic-bezier(.5,0,.2,1)'}).onfinish=()=>{ghost.remove();target.style.opacity=''};
}

document.addEventListener('click',e=>{
 const t=e.target;if(t.closest('select'))return;
 const rm=t.closest('[data-rm]'),tile=t.closest('.tile'),sg=t.closest('[data-sg]');
 if(rm){act('remove',rm.dataset.t,rm.dataset.hero);undoStack=undoStack.filter(u=>u.name!==rm.dataset.hero);return}
 if(tile){if(!tile.classList.contains('used'))choose(tile.dataset.h,tile);return}
 if(sg){const pt=document.querySelector(`.tile[data-h="${CSS.escape(sg.dataset.sg)}"]`);choose(sg.dataset.sg,pt||sg);return}
 if(t.id==='ask')askCoach(false);else if(t.id==='reread'){coachKey='';askCoach(true)}
 else if(t.id==='clearAll'){$('#q').value='';role='';lane='';drawFilters();drawGrid()}
});
document.addEventListener('change',e=>{const s=e.target.closest('[data-lane]');if(s)act('lane',s.dataset.t,s.dataset.hero,'&lane='+encodeURIComponent(s.value))});
document.addEventListener('input',e=>{const n=e.target.closest('.tname');if(n)store.set('jongrai-name-'+n.dataset.team,n.value)});
document.addEventListener('pointerover',e=>{const t=e.target.closest('.tile:not(.used)');if(t)lens(byName[t.dataset.h])});
document.addEventListener('focusin',e=>{const t=e.target.closest('.tile:not(.used)');if(t)lens(byName[t.dataset.h])});
$('#grid').addEventListener('pointerleave',()=>lens(null));
$('#bansOn').setAttribute('aria-checked',bansOn);
$('#bansOn').onclick=()=>{bansOn=!bansOn;store.set('jongrai-bans',bansOn?'on':'off');$('#bansOn').setAttribute('aria-checked',bansOn);
 if(!bansOn)manual.kind='pick';refresh(false);
 toast(bansOn?'Bans on: tournament order, 20 steps.':'Bans off: picks only, 10 steps in snake order.')};
$('#follow').onclick=()=>{const now=acting();follow=!follow;$('#follow').setAttribute('aria-checked',follow);if(!follow)manual=now;refresh(false)};
function freeMode(patch){if(follow){manual=acting();follow=false;$('#follow').setAttribute('aria-checked',false);toast('Free mode: you choose the side and action. Turn “Follow draft order” back on any time.')}
 Object.assign(manual,patch);drawRail();drawSides(false);drawGrid();drawNext()}
$('#sideSeg').onclick=e=>{const b=e.target.closest('button');if(b)freeMode({side:b.dataset.s})};
$('#kindSeg').onclick=e=>{const b=e.target.closest('button');if(b)freeMode({kind:b.dataset.k})};
$('#undo').onclick=()=>{const u=undoStack.pop();$('#undo').disabled=!undoStack.length;if(u)act('remove',u.side,u.name)};
// Reset needs a 0.7 s hold (or two presses from the keyboard), so a stray click never wipes a finished draft.
let holdT,armed=false;
const doReset=async()=>{undoStack=[];$('#undo').disabled=true;adopt(await call('/api/reset?v='+state.version,{post:true}));toast('Board cleared')};
$('#reset').onpointerdown=()=>{$('#reset').classList.add('holding');holdT=setTimeout(()=>{$('#reset').classList.remove('holding');doReset()},700)};
['pointerup','pointerleave'].forEach(ev=>$('#reset').addEventListener(ev,()=>{clearTimeout(holdT);$('#reset').classList.remove('holding')}));
$('#reset').onkeydown=e=>{if(e.key!=='Enter'&&e.key!==' ')return;e.preventDefault();
 if(armed){armed=false;$('#resetLbl').textContent='Hold to reset';doReset()}else{armed=true;$('#resetLbl').textContent='Press again to reset';setTimeout(()=>{armed=false;$('#resetLbl').textContent='Hold to reset'},2500)}};
document.addEventListener('keydown',e=>{
 const typing=/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
 if(e.key==='/'&&!typing){e.preventDefault();$('#q').focus();$('#q').select()}
 else if((e.ctrlKey||e.metaKey)&&e.key==='z'&&!typing){e.preventDefault();$('#undo').click()}
 else if(document.activeElement===$('#q')&&e.key==='Enter'){const t=document.querySelector('.tile:not(.used)');if(t)choose(t.dataset.h,t)}
 else if(document.activeElement===$('#q')&&e.key==='Escape'){$('#q').value='';drawGrid()}
});
// Another window may have changed the board; catch up when this one comes back.
addEventListener('focus',async()=>{const s=await call('/api/state');if(!s.error&&s.version!==state.version)adopt(s)});
function drawFilters(){
 $('#roles').innerHTML=Object.entries(ROLE_ICON).map(([r,f])=>`<button class="chip" data-role="${r}" aria-pressed="${role===r}"><img src="${icon(f)}" alt="">${cap(r.toLowerCase())}</button>`).join('');
 $('#lanes').innerHTML=LANES.map(l=>`<button class="chip" data-lane-f="${l}" aria-pressed="${lane===l}"><img src="/icons/${laneIcon(l)}" alt="">${cap(l.toLowerCase())}</button>`).join('')+'<span class="count num" id="count"></span>'+SORT.replace(`value="${sortBy}"`,`value="${sortBy}" selected`);
}
$('#roles').onclick=e=>{const b=e.target.closest('[data-role]');if(!b)return;role=role===b.dataset.role?'':b.dataset.role;drawFilters();drawGrid()};
$('#lanes').onclick=e=>{const b=e.target.closest('[data-lane-f]');if(!b)return;lane=lane===b.dataset.laneF?'':b.dataset.laneF;drawFilters();drawGrid()};
$('#q').oninput=drawGrid;document.addEventListener('change',e=>{if(e.target.id==='sort'){sortBy=e.target.value;drawGrid()}});
$('#ticks').innerHTML=Array.from({length:40},(_,i)=>{const g=i*9*Math.PI/180,r1=i%10?96:93;return`<line x1="${100+Math.sin(g)*r1}" y1="${100-Math.cos(g)*r1}" x2="${100+Math.sin(g)*99}" y2="${100-Math.cos(g)*99}"/>`}).join('');

(async()=>{
 shell('draft.html');
 const hs=await call('/api/heroes');if(hs.error){toast(hs.error,'var(--ember)');return}
 heroes=hs;heroes.forEach(h=>byName[h.name]=h);
 drawFilters();
 const s=await call('/api/state');if(s.error){toast(s.error,'var(--ember)');return}
 state=s;refresh(false);
})();
</script></body></html>
